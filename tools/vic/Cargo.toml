[package]
name = "vic"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
lexopt = "0.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
