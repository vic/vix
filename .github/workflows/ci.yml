      - run: "echo \"<code>$(readlink -f result)</code>\" >> \"$GITHUB_STEP_SUMMARY\""
    strategy:
      fail-fast: false
      matrix:
        include:
          - allowFailure: false
            attr: "nixosConfigurations.bill.config.system.build.toplevel"
            name: "bill"
            runner: "ubuntu-24.04-arm"
            system: "aarch64-linux"
          - allowFailure: false
